<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Media Loader</title>
  <style>
    :root, [data-theme="midnight"] {
      --bg: #080b12;
      --bg-grad: radial-gradient(circle at 50% 0%, #131b2e 0%, #080b12 72%);
      --card: #101624;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f3f6fc;
      --muted: #7e8ba3;
      --accent: #3b82f6;
      --accent-2: #60a5fa;
      --accent-rgb: 59, 130, 246;
      --accent-glow: rgba(59, 130, 246, 0.28);
      --danger: #ef4444;
      --success: #10b981;
      --input-bg: #0a0f1a;
      --nav-bg: rgba(13, 19, 32, 0.96);
    }
    [data-theme="crimson"] {
      --bg: #11070a;
      --bg-grad: radial-gradient(circle at 50% 0%, #2b1019 0%, #11070a 72%);
      --card: #1c0d13;
      --card-border: rgba(244, 63, 94, 0.16);
      --text: #fff1f2;
      --muted: #b88691;
      --accent: #f43f5e;
      --accent-2: #fb7185;
      --accent-rgb: 244, 63, 94;
      --accent-glow: rgba(244, 63, 94, 0.28);
      --input-bg: #14080c;
      --nav-bg: rgba(24, 10, 15, 0.96);
    }
    [data-theme="emerald"] {
      --bg: #06110d;
      --bg-grad: radial-gradient(circle at 50% 0%, #0d2b20 0%, #06110d 72%);
      --card: #0c1f17;
      --card-border: rgba(16, 185, 129, 0.16);
      --text: #ecfdf5;
      --muted: #7fa998;
      --accent: #10b981;
      --accent-2: #34d399;
      --accent-rgb: 16, 185, 129;
      --accent-glow: rgba(16, 185, 129, 0.28);
      --input-bg: #071510;
      --nav-bg: rgba(10, 25, 19, 0.96);
    }
    [data-theme="ocean"] {
      --bg: #061017;
      --bg-grad: radial-gradient(circle at 50% 0%, #0c2738 0%, #061017 72%);
      --card: #0b1c29;
      --card-border: rgba(6, 182, 212, 0.16);
      --text: #ecfeff;
      --muted: #7fa4b5;
      --accent: #06b6d4;
      --accent-2: #22d3ee;
      --accent-rgb: 6, 182, 212;
      --accent-glow: rgba(6, 182, 212, 0.28);
      --input-bg: #07131c;
      --nav-bg: rgba(9, 23, 34, 0.96);
    }
    [data-theme="amoled"] {
      --bg: #000000;
      --bg-grad: none;
      --card: #0b0b0e;
      --card-border: rgba(255, 255, 255, 0.11);
      --text: #ffffff;
      --muted: #8a8a93;
      --accent: #8b5cf6;
      --accent-2: #a78bfa;
      --accent-rgb: 139, 92, 246;
      --accent-glow: rgba(139, 92, 246, 0.3);
      --input-bg: #050507;
      --nav-bg: rgba(10, 10, 14, 0.98);
    }

    :root {
      --spring-dur: 0.24s;
      --pill-dur: 0.26s;
    }
    body[data-fps="30"] { --spring-dur: 0.34s; --pill-dur: 0.36s; }
    body[data-fps="60"] { --spring-dur: 0.24s; --pill-dur: 0.26s; }
    body[data-fps="90"] { --spring-dur: 0.18s; --pill-dur: 0.20s; }
    body[data-fps="120"] { --spring-dur: 0.14s; --pill-dur: 0.16s; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px 132px 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
      flex-shrink: 0;
    }
    .brand-logo svg {
      width: 21px;
      height: 21px;
      fill: #fff;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .header-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .version-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.14);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      color: var(--accent-2);
    }

    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.26);
      contain: layout style;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      display: block;
    }

    .platform-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(var(--accent-rgb), 0.16);
      border: 1px solid rgba(var(--accent-rgb), 0.38);
      color: var(--accent-2);
      display: none;
    }
    .platform-badge.show {
      display: inline-block;
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .url-input-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .url-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 13px 34px 13px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      user-select: text;
    }
    .url-input:focus {
      border-color: var(--accent);
    }
    .clear-input-btn {
      position: absolute;
      right: 8px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .clear-input-btn.show {
      display: flex;
    }

    .paste-btn, .seg-btn, .dl-btn, .act-btn, .nav-btn, .danger-btn, .select-btn {
      transform: translateZ(0);
      backface-visibility: hidden;
      transition: transform var(--spring-dur) cubic-bezier(0.22, 1, 0.36, 1);
    }
    .paste-btn:active, .seg-btn:active, .dl-btn:active, .act-btn:active, .nav-btn:active, .danger-btn:active, .select-btn:active {
      transform: scale3d(0.93, 0.93, 1);
    }

    .paste-btn {
      background: rgba(var(--accent-rgb), 0.14);
      border: 1px solid rgba(var(--accent-rgb), 0.32);
      color: var(--accent-2);
      border-radius: 14px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .seg-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .seg-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .seg-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .theme-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .theme-grid .seg-btn {
      flex: 1 1 calc(33.333% - 8px);
      min-width: 92px;
    }

    .seg-btn {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 11px 8px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }
    .seg-btn.sm {
      padding: 8px 4px;
      font-size: 11.5px;
      border-radius: 11px;
    }

    body[data-btn-style="glass"] .seg-btn.active,
    body[data-btn-style="glass"] .paste-btn,
    body[data-btn-style="glass"] .act-btn.primary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(var(--accent-rgb), 0.24) 100%);
      border-color: rgba(var(--accent-rgb), 0.58);
      color: #ffffff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    body[data-btn-style="glass"] .dl-btn {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.92), var(--accent-2));
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 6px 16px var(--accent-glow);
    }
    body[data-btn-style="glass"] .nav-pill {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(var(--accent-rgb), 0.28) 100%);
      border: 1px solid rgba(var(--accent-rgb), 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    body[data-btn-style="neon"] .seg-btn.active,
    body[data-btn-style="neon"] .paste-btn,
    body[data-btn-style="neon"] .act-btn.primary {
      background: rgba(var(--accent-rgb), 0.16);
      border-color: var(--accent-2);
      color: #ffffff;
      box-shadow: 0 0 12px var(--accent-glow), inset 0 0 6px rgba(var(--accent-rgb), 0.25);
    }
    body[data-btn-style="neon"] .dl-btn {
      background: rgba(var(--accent-rgb), 0.24);
      border: 1.5px solid var(--accent-2);
      color: #ffffff;
      box-shadow: 0 0 16px var(--accent-glow), inset 0 0 10px rgba(var(--accent-rgb), 0.35);
    }
    body[data-btn-style="neon"] .nav-pill {
      background: rgba(var(--accent-rgb), 0.18);
      border: 1.5px solid var(--accent-2);
      box-shadow: 0 0 12px var(--accent-glow), inset 0 0 6px rgba(var(--accent-rgb), 0.28);
    }

    body[data-btn-style="gradient"] .seg-btn.active,
    body[data-btn-style="gradient"] .paste-btn,
    body[data-btn-style="gradient"] .act-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    body[data-btn-style="gradient"] .dl-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      box-shadow: 0 6px 16px var(--accent-glow);
    }
    body[data-btn-style="gradient"] .nav-pill {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    body[data-btn-style="outline"] .seg-btn.active,
    body[data-btn-style="outline"] .paste-btn,
    body[data-btn-style="outline"] .act-btn.primary {
      background: rgba(var(--accent-rgb), 0.08);
      border: 1.5px solid var(--accent-2);
      color: var(--accent-2);
      box-shadow: none;
    }
    body[data-btn-style="outline"] .dl-btn {
      background: rgba(var(--accent-rgb), 0.14);
      border: 1.5px solid var(--accent);
      color: var(--text);
      box-shadow: none;
    }
    body[data-btn-style="outline"] .nav-pill {
      background: rgba(var(--accent-rgb), 0.10);
      border: 1.5px solid var(--accent-2);
      box-shadow: none;
    }

    .dl-btn {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .dl-btn:disabled {
      opacity: 0.55;
      pointer-events: none;
    }

    .progress-wrap {
      display: none;
      margin-top: 12px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
      color: var(--text);
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.18s linear;
    }

    .status-msg {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.35;
    }
    .status-msg.ok {
      display: block;
      background: rgba(16, 185, 129, 0.13);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .status-msg.err {
      display: block;
      background: rgba(239, 68, 68, 0.13);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .hist-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .hist-stats {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }
    .hist-actions-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .select-btn {
      background: rgba(var(--accent-rgb), 0.13);
      border: 1px solid rgba(var(--accent-rgb), 0.32);
      color: var(--accent-2);
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .danger-btn {
      background: rgba(239, 68, 68, 0.13);
      border: 1px solid rgba(239, 68, 68, 0.32);
      color: #f87171;
      padding: 6px 11px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hist-item {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 11px;
      display: flex;
      gap: 11px;
      align-items: center;
      contain: layout style;
    }
    .hist-item.selected {
      border-color: var(--accent);
      background: rgba(var(--accent-rgb), 0.09);
    }
    .hist-check {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid var(--muted);
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
    }
    .select-mode .hist-check {
      display: flex;
    }
    .hist-item.selected .hist-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .hist-thumb {
      width: 60px;
      height: 60px;
      border-radius: 11px;
      background: var(--input-bg);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--card-border);
    }
    .hist-info {
      flex: 1;
      min-width: 0;
    }
    .hist-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .hist-meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .hist-btns {
      display: flex;
      gap: 6px;
    }
    .act-btn {
      padding: 5px 10px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
    }
    .act-btn.del {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.25);
    }
    .empty-box {
      text-align: center;
      padding: 28px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 2px;
    }
    .setting-row:first-of-type {
      padding-top: 4px;
    }
    .setting-title {
      font-size: 13.5px;
      font-weight: 700;
    }
    .setting-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      width: 46px;
      height: 26px;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform var(--spring-dur) cubic-bezier(0.22, 1, 0.36, 1), background-color 0.15s;
    }
    .switch.on {
      background: rgba(var(--accent-rgb), 0.24);
      border-color: rgba(var(--accent-rgb), 0.6);
    }
    .switch.on::after {
      transform: translate3d(20px, 0, 0);
      background: var(--accent-2);
    }

    .bottom-nav-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
      display: flex;
      justify-content: center;
      padding: 0 16px;
      z-index: 50;
      pointer-events: none;
    }
    .bottom-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 440px;
      background: var(--nav-bg);
      border: 1px solid rgba(var(--accent-rgb), 0.26);
      border-radius: 22px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      position: relative;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
    }
    .nav-pill {
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 6px;
      width: calc((100% - 12px) / 3);
      border-radius: 16px;
      transform: translate3d(0%, 0, 0);
      transition: transform var(--pill-dur) cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 0;
    }
    .nav-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 9px 4px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }
    .nav-btn.active {
      color: #ffffff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px;
      overflow: hidden;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .modal-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-weight: 800;
      cursor: pointer;
    }
    .media-box video, .media-box audio, .media-box img {
      width: 100%;
      max-height: 68vh;
      border-radius: 12px;
      background: #000;
      display: block;
    }
  </style>
</head>
<body data-theme="midnight" data-btn-style="glass" data-fps="60">

  <header class="header">
    <div class="brand">

    // Локальное хранилище медиафайлов (IndexedDB), чтобы видео открывалось в плеере даже без Termux
    function openMediaDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("ml_offline_media_db", 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("blobs")) {
            db.createObjectStore("blobs");
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveMediaBlob(key, blob) {
      try {
        const db = await openMediaDB();
        return new Promise((resolve) => {
          const tx = db.transaction("blobs", "readwrite");
          tx.objectStore("blobs").put(blob, key);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => resolve(false);
        });
      } catch (_e) { return false; }
    }

    async function getMediaBlobUrl(key) {
      try {
        const db = await openMediaDB();
        return new Promise((resolve) => {
          const tx = db.transaction("blobs", "readonly");
          const req = tx.objectStore("blobs").get(key);
          req.onsuccess = () => {
            if (req.result instanceof Blob) {
              resolve(URL.createObjectURL(req.result));
            } else {
              resolve(null);
            }
          };
          req.onerror = () => resolve(null);
        });
      } catch (_e) { return null; }
    }

    async function deleteMediaBlob(key) {
      try {
        const db = await openMediaDB();
        const tx = db.transaction("blobs", "readwrite");
        tx.objectStore("blobs").delete(key);
      } catch (_e) {}
    }

    function detectPlatform(url) {
      const u = (url || "").toLowerCase();
      if (!u) return "";
      if (u.includes("tiktok.com")) return "TIKTOK";
      if (u.includes("youtube.com") || u.includes("youtu.be")) return "YOUTUBE";
      if (u.includes("instagram.com")) return "INSTAGRAM";
      if (u.includes("vk.com") || u.includes("vkvideo.ru")) return "VK VIDEO";
      if (u.includes("pinterest.") || u.includes("pin.it")) return "PINTEREST";
      if (u.includes("twitter.com") || u.includes("x.com")) return "X / TWITTER";
      if (u.includes("soundcloud.com")) return "SOUNDCLOUD";
      if (u.startsWith("http")) return "LINK";
      return "";
    }

    // Универсальное чтение буфера обмена (Capacitor Native + Android Bridge + Web Clipboard API + Termux)
    async function readClipboardUniversal() {
      // 1. Нативный мост Android (MainActivity JavascriptInterface)
      try {
        if (window.AndroidNative && typeof window.AndroidNative.getClipboard === "function") {
          const txt = window.AndroidNative.getClipboard();
          if (txt && String(txt).trim()) return String(txt).trim();
        }
      } catch (_e) {}

      // 2. Официальный нативный плагин @capacitor/clipboard
      try {
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Clipboard) {
          const res = await window.Capacitor.Plugins.Clipboard.read();
          if (res && res.value && String(res.value).trim()) return String(res.value).trim();
        }
      } catch (_e) {}

      // 3. Браузерный Clipboard API (вызывает системный запрос разрешения Android WebView)
      try {
        if (navigator.clipboard && typeof navigator.clipboard.readText === "function") {
          const txt = await navigator.clipboard.readText();
          if (txt && String(txt).trim()) return String(txt).trim();
        }
      } catch (_e) {}

      // 4. Резерв через локальный сервер Termux (если запущен)
      try {
        const r = await fetchWithTimeout(API + "/clipboard", {}, 900);
        if (r.ok) {
          const d = await r.json();
          if (d && d.text && String(d.text).trim()) return String(d.text).trim();
        }
      } catch (_e) {}

      return "";
    }

    async function pasteClipboard(silent = false) {
      const txt = await readClipboardUniversal();
      if (txt) {
        if (!silent || txt.startsWith("http")) {
          elUrl.value = txt;
          onUrlChanged();
          if (!silent) showMsg(t("msgClipboardOk"), "ok");
        }
        return;
      }

      if (!silent) {
        elUrl.focus();
        try { document.execCommand("paste"); } catch (_e) {}
        setTimeout(() => {
          onUrlChanged();
          if (!elUrl.value.trim()) {
            showMsg(t("msgClipboardEmpty"), "err");
          }
        }, 120);
      }
    }

    function showMsg(text, type) {
      elStatusMsg.className = "status-msg " + (type || "ok");
      elStatusMsg.textContent = text;
      elStatusMsg.style.display = "block";
    }

    function parseSizeMB(sizeStr) {
      if (!sizeStr) return 0;
      const m = String(sizeStr).match(/([\d.]+)\s*(MB|KB|GB)/i);
      if (!m) return 0;
      const val = parseFloat(m[1]) || 0;
      const unit = m[2].toUpperCase();
      if (unit === "GB") return val * 1024;
      if (unit === "KB") return val / 1024;
      return val;
    }

    function toggleSelectMode() {
      state.selectMode = !state.selectMode;
      state.selectedIds = [];
      renderHistory();
    }

    function toggleSelectItem(idx) {
      const pos = state.selectedIds.indexOf(idx);
      if (pos === -1) state.selectedIds.push(idx);
      else state.selectedIds.splice(pos, 1);
      renderHistory();
    }

    function deleteSelectedHistory() {
      if (!state.selectedIds.length) return;
      const toRemove = new Set(state.selectedIds);
      state.history.forEach((item, idx) => {
        if (toRemove.has(idx) && item.offlineKey) deleteMediaBlob(item.offlineKey);
      });
      state.history = state.history.filter((_, idx) => !toRemove.has(idx));
      state.selectedIds = [];
      state.selectMode = false;
      localStorage.setItem("ml_hist_v6", JSON.stringify(state.history));
      renderHistory();
    }

    function renderHistory() {
      const totalMB = state.history.reduce((acc, item) => acc + parseSizeMB(item.size), 0);
      const sizeBadge = totalMB > 0 ? ` • ${totalMB.toFixed(1)} MB` : "";
      elHistStats.textContent = `${t("filesCount")}${state.history.length}${sizeBadge}`;

      elSelectModeBtn.textContent = state.selectMode ? t("cancelSelectBtn") : t("selectBtn");
      elSelectModeBtn.style.display = state.history.length ? "inline-block" : "none";

      if (state.selectMode && state.selectedIds.length > 0) {
        elDelSelectedBtn.style.display = "inline-block";
        elDelSelectedBtn.textContent = `${t("delSelectedBtn")} (${state.selectedIds.length})`;
      } else {
        elDelSelectedBtn.style.display = "none";
      }

      elHistList.classList.toggle("select-mode", state.selectMode);

      if (!state.history.length) {
        elHistList.innerHTML = `<div class="card empty-box">${t("emptyHist")}</div>`;
        return;
      }

      const watchTxt = t("watchBtn");
      const listenTxt = t("listenBtn");
      const delTxt = t("delBtn");

      elHistList.innerHTML = state.history.map((item, idx) => {
        const isAudio = item.mode === "audio";
        const actLabel = isAudio ? listenTxt : watchTxt;
        const thumb = item.thumb || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='100%' height='100%' fill='%23101624'/></svg>";
        const safeTitle = (item.title || item.filename || "Media").replace(/</g, "&lt;");
        const meta = [item.mode ? item.mode.toUpperCase() : "MEDIA", item.size || "", item.date || ""].filter(Boolean).join(" • ");
        const isSel = state.selectedIds.includes(idx);

        return `
          <div class="hist-item ${isSel ? "selected" : ""}" onclick="${state.selectMode ? `toggleSelectItem(${idx})` : ""}">
            <div class="hist-check">${isSel ? "✓" : ""}</div>
            <img class="hist-thumb" src="${thumb}" loading="lazy" onerror="this.style.opacity=0.25" />
            <div class="hist-info">
              <div class="hist-title">${safeTitle}</div>
              <div class="hist-meta">${meta}</div>
              <div class="hist-btns">
                <button class="act-btn primary" onclick="event.stopPropagation();openHistoryItem(${idx})">${actLabel}</button>
                <button class="act-btn del" onclick="event.stopPropagation();removeHistoryItem(${idx})">${delTxt}</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function removeHistoryItem(idx) {
      const item = state.history[idx];
      if (item && item.offlineKey) deleteMediaBlob(item.offlineKey);
      state.history.splice(idx, 1);
      localStorage.setItem("ml_hist_v6", JSON.stringify(state.history));
      renderHistory();
    }

    function clearHistory() {
      state.history.forEach(item => {
        if (item && item.offlineKey) deleteMediaBlob(item.offlineKey);
      });
      state.history = [];
      state.selectedIds = [];
      state.selectMode = false;
      localStorage.setItem("ml_hist_v6", "[]");
      renderHistory();
    }

    async function openHistoryItem(idx) {
      const item = state.history[idx];
      if (!item) return;

      const modal = document.getElementById("playerModal");
      const titleEl = document.getElementById("modalTitle");
      const bodyEl = document.getElementById("modalBody");
      titleEl.textContent = item.title || item.filename || "Media";

      // 1. Проверяем сохранённый офлайн-файл в IndexedDB (работает без Termux и без интернета)
      let playUrl = null;
      if (item.offlineKey) {
        playUrl = await getMediaBlobUrl(item.offlineKey);
      }

      // 2. Если файла нет в IndexedDB, проверяем локальный сервер Termux или прямую ссылку
      if (!playUrl) {
        const termuxAlive = await checkTermuxAlive();
        if (termuxAlive && item.filename) {
          const qName = encodeURIComponent(item.filename || "");
          const qTitle = encodeURIComponent(item.title || "");
          playUrl = `${API}/file?name=${qName}&title=${qTitle}&t=${Date.now()}`;
        } else if (item.remoteUrl) {
          playUrl = item.remoteUrl;
        }
      }

      if (!playUrl) {
        const qName = encodeURIComponent(item.filename || "");
        const qTitle = encodeURIComponent(item.title || "");
        playUrl = `${API}/file?name=${qName}&title=${qTitle}&t=${Date.now()}`;
      }

      if (item.mode === "audio") {
        bodyEl.innerHTML = `<audio src="${playUrl}" controls autoplay style="width:100%;margin-top:8px;"></audio>`;
      } else {
        bodyEl.innerHTML = `<video src="${playUrl}" controls autoplay playsinline preload="auto"></video>`;
      }
      modal.classList.add("open");
    }

    function closeModal() {
      const modal = document.getElementById("playerModal");
      const bodyEl = document.getElementById("modalBody");
      bodyEl.innerHTML = "";
      modal.classList.remove("open");
    }

    function fetchWithTimeout(url, options = {}, timeoutMs = 1500) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), timeoutMs);
      return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(id));
    }

    async function checkTermuxAlive() {
      try {
        const r = await fetchWithTimeout(API + "/progress", {}, 1100);
        return r.ok;
      } catch (_e) {
        return false;
      }
    }

    // Сохранение файла на телефон без Termux
    async function triggerDeviceSave(blobOrUrl, filename) {
      // Если есть нативный Android DownloadManager мост в APK и передан прямой URL
      if (typeof blobOrUrl === "string" && window.AndroidNative && typeof window.AndroidNative.downloadUrl === "function") {
        try {
          window.AndroidNative.downloadUrl(blobOrUrl, filename);
          return true;
        } catch (_e) {}
      }
      // Если передан Blob
      if (blobOrUrl instanceof Blob) {
        const bUrl = URL.createObjectURL(blobOrUrl);
        const a = document.createElement("a");
        a.href = bUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(bUrl), 5000);
        return true;
      }
      return false;
    }

    // Автономная загрузка БЕЗ Termux (Облачный сервер Media Loader + прямые API TikWM / Cobalt)
    async function startCloudFallbackDownload(url) {
      elProgState.textContent = t("msgCloudDl");
      elProgPct.textContent = "25%";
      elProgFill.style.width = "25%";

      const ext = state.mode === "audio" ? "mp3" : "mp4";
      let title = "Media_" + Date.now();
      let thumb = "";
      let directMediaUrl = "";
      let downloadedBlob = null;

      // Способ А: Если это TikTok — мгновенное прямое API TikWM (HD без водяного знака)
      if (url.toLowerCase().includes("tiktok.com")) {
        try {
          const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`;
          const r = await fetchWithTimeout(apiUrl, {}, 10000);
          const j = await r.json();
          if (j && j.data) {
            title = j.data.title || j.data.author?.nickname || title;
            thumb = j.data.cover || j.data.origin_cover || "";
            if (state.mode === "audio" && j.data.music) {
              directMediaUrl = j.data.music;
            } else {
              directMediaUrl = state.noWatermark
                ? (j.data.hdplay || j.data.play || j.data.wmplay)
                : (j.data.wmplay || j.data.play);
            }
          }
        } catch (_e) {}
      }

      // Способ Б: Через облачный сервер приложения Media Loader (поддерживает YouTube, Instagram, VK, TikTok и др.)
      if (!directMediaUrl) {
        try {
          elProgPct.textContent = "45%";
          elProgFill.style.width = "45%";

          const infoRes = await fetchWithTimeout(`${CLOUD_API}/api/info?url=${encodeURIComponent(url)}`, {}, 15000);
          if (infoRes.ok) {
            const infoData = await infoRes.json();
            if (infoData.title) title = infoData.title;
            if (infoData.thumbnail) thumb = infoData.thumbnail;
          }

          const dlParams = new URLSearchParams({
            url: url,
            type: state.mode,
            quality: state.quality === "max" ? "1080" : state.quality,
            no_watermark: state.noWatermark ? "1" : "0"
          });
          directMediaUrl = `${CLOUD_API}/api/download?${dlParams.toString()}`;
        } catch (_e) {}
      }

      if (!directMediaUrl) {
        throw new Error("Не удалось получить поток без Termux");
      }

      elProgPct.textContent = "75%";
      elProgFill.style.width = "75%";

      const cleanName = title.replace(/[\\/:*?"<>|#]/g, "_").slice(0, 60).trim() || ("Media_" + Date.now());
      const filename = `${cleanName}.${ext}`;
      let sizeText = "";
      const offlineKey = "media_" + Date.now();

      try {
        const mediaResp = await fetch(directMediaUrl);
        if (mediaResp.ok) {
          downloadedBlob = await mediaResp.blob();
          const mb = downloadedBlob.size / (1024 * 1024);
          if (mb > 0.05) {
            sizeText = mb.toFixed(1) + " MB";
            await saveMediaBlob(offlineKey, downloadedBlob);
            await triggerDeviceSave(downloadedBlob, filename);
          }
        }
      } catch (_e) {
        // Если CORS не дал скачать в Blob, передаём ссылку нативному загрузчику Android
        await triggerDeviceSave(directMediaUrl, filename);
      }

      elProgPct.textContent = "100%";
      elProgFill.style.width = "100%";
      elDlBtn.disabled = false;
      setTimeout(() => { elProgWrap.style.display = "none"; }, 500);

      const newItem = {
        title: title,
        filename: filename,
        thumb: thumb,
        mode: state.mode,
        size: sizeText || "Cloud",
        date: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
        offlineKey: downloadedBlob ? offlineKey : null,
        remoteUrl: directMediaUrl
      };

      state.history.unshift(newItem);
      if (state.history.length > 60) state.history.pop();
      localStorage.setItem("ml_hist_v6", JSON.stringify(state.history));
      renderHistory();

      showMsg(t("msgSaved") + filename + (sizeText ? " (" + sizeText + ")" : "") + " :)", "ok");
    }

    async function startDownload() {
      const url = elUrl.value.trim();
      if (!url) {
        showMsg(t("msgEnterUrl"), "err");
        return;
      }

      elStatusMsg.style.display = "none";
      elDlBtn.disabled = true;
      elProgWrap.style.display = "block";
      elProgState.textContent = t("msgStart");
      elProgPct.textContent = "0%";
      elProgFill.style.width = "0%";

      // 1. Проверяем, запущен ли локальный сервер Termux
      const termuxRunning = await checkTermuxAlive();

      // 2. Если Termux НЕ запущен — качаем напрямую через облачный/прямой движок!
      if (!termuxRunning) {
        try {
          await startCloudFallbackDownload(url);
        } catch (err) {
          elDlBtn.disabled = false;
          elProgWrap.style.display = "none";
          showMsg("Ошибка загрузки: " + err.message, "err");
        }
        return;
      }

      // 3. Если Termux запущен — качаем через локальный сервер Termux
      try {
        const res = await fetch(API + "/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            url: url,
            mode: state.mode,
            quality: state.quality,
            no_watermark: state.noWatermark
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(async () => {
          try {
            const pRes = await fetch(API + "/progress");
            const pData = await pRes.json();

            const pct = Math.min(100, Math.max(0, Math.round(pData.percent || 0)));
            elProgPct.textContent = pct + "%";
            elProgFill.style.width = pct + "%";
            elProgState.textContent = pData.status_text || t("msgDownloading");

            if (pData.status === "error") {
              clearInterval(pollTimer);
              elDlBtn.disabled = false;
              elProgWrap.style.display = "none";
              showMsg(pData.error || "Error", "err");
            } else if (pData.status === "done") {
              clearInterval(pollTimer);
              elDlBtn.disabled = false;
              setTimeout(() => { elProgWrap.style.display = "none"; }, 400);

              const newItem = {
                title: pData.title || pData.filename || "Media",
                filename: pData.filename || pData.saved_to || "",
                thumb: pData.thumb || "",
                mode: state.mode,
                size: pData.size || "",
                date: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
              };
              state.history.unshift(newItem);
              if (state.history.length > 60) state.history.pop();
              localStorage.setItem("ml_hist_v6", JSON.stringify(state.history));
              renderHistory();

              showMsg(t("msgSaved") + (pData.saved_to || "file") + (pData.size ? " (" + pData.size + ")" : "") + " :)", "ok");
            }
          } catch (_err) {}
        }, 500);
      } catch (e) {
        // Если Termux оборвался — пробуем скачать напрямую без Termux
        try {
          await startCloudFallbackDownload(url);
        } catch (_err2) {
          elDlBtn.disabled = false;
          elProgWrap.style.display = "none";
          showMsg(e.message, "err");
        }
      }
    }

    loadPrefs();
  </script>
