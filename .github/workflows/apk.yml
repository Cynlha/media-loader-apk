name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android project & Set Custom App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install
          npx cap add android
          sed -i 's/versionName "1.0"/versionName "0.1 BETA"/g' android/app/build.gradle
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          if [ -f icon.png ]; then
            convert icon.png -resize 192x192^ -gravity center -extent 192x192 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 192x192^ -gravity center -extent 192x192 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
            convert icon.png -resize 192x192^ -gravity center -extent 192x192 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png

            convert icon.png -resize 256x256^ -gravity center -extent 256x256 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 256x256^ -gravity center -extent 256x256 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            convert icon.png -resize 256x256^ -gravity center -extent 256x256 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png

            convert icon.png -resize 384x384^ -gravity center -extent 384x384 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 384x384^ -gravity center -extent 384x384 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            convert icon.png -resize 384x384^ -gravity center -extent 384x384 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png

            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png

            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            convert icon.png -resize 512x512^ -gravity center -extent 512x512 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          fi

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
