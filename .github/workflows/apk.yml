name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android project & Set Custom App Icon
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          if [ -f icon.jpg ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              rm -f "$dir"/ic_launcher*.webp "$dir"/ic_launcher*.xml
              convert icon.jpg -resize 512x512^ -gravity center -extent 512x512 "$dir/ic_launcher.png"
              convert icon.jpg -resize 512x512^ -gravity center -extent 512x512 "$dir/ic_launcher_round.png"
              convert icon.jpg -resize 512x512^ -gravity center -extent 512x512 "$dir/ic_launcher_foreground.png"
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi
          npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
