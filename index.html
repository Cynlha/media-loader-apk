<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#0f0a0c" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Media Loader</title>
<style>
:root{--bg:#0f0a0c;--card:#1a1114;--card-2:#24171b;--text:#f9ecef;--muted:#b08d96;--acc:#f43f5e;--acc-rgb:244,63,94;--border:rgba(244,63,94,0.22);--glass-dock:rgba(26,17,20,0.78);--glass-dock-border:rgba(244,63,94,0.28);--glass-btn:rgba(244,63,94,0.08);--glass-btn-border:rgba(244,63,94,0.18);--glass-active:rgba(244,63,94,0.24);--glass-active-border:rgba(244,63,94,0.55);--rad-card:18px;--rad-btn:12px;color-scheme:dark}
body[data-theme="midnight"]{--bg:#090d16;--card:#111827;--card-2:#1e293b;--text:#f1f5f9;--muted:#8b9bb4;--acc:#6366f1;--acc-rgb:99,102,241;--border:rgba(99,102,241,0.22);--glass-dock:rgba(17,24,39,0.78);--glass-dock-border:rgba(99,102,241,0.28);--glass-btn:rgba(99,102,241,0.08);--glass-btn-border:rgba(99,102,241,0.18);--glass-active:rgba(99,102,241,0.24);--glass-active-border:rgba(99,102,241,0.55)}
body[data-theme="emerald"]{--bg:#07120e;--card:#0d1f18;--card-2:#152e24;--text:#ecfdf5;--muted:#82a898;--acc:#10b981;--acc-rgb:16,185,129;--border:rgba(16,185,129,0.22);--glass-dock:rgba(13,31,24,0.78);--glass-dock-border:rgba(16,185,129,0.28);--glass-btn:rgba(16,185,129,0.08);--glass-btn-border:rgba(16,185,129,0.18);--glass-active:rgba(16,185,129,0.24);--glass-active-border:rgba(16,185,129,0.55)}
body[data-theme="amoled"]{--bg:#000000;--card:#09090b;--card-2:#141418;--text:#fafafa;--muted:#8e8e98;--acc:#d4d4d8;--acc-rgb:212,212,216;--border:rgba(255,255,255,0.15);--glass-dock:rgba(9,9,11,0.82);--glass-dock-border:rgba(255,255,255,0.22);--glass-btn:rgba(255,255,255,0.06);--glass-btn-border:rgba(255,255,255,0.14);--glass-active:rgba(255,255,255,0.16);--glass-active-border:rgba(255,255,255,0.44)}
body[data-shape="rounded"]{--rad-card:18px;--rad-btn:12px}
body[data-shape="pill"]{--rad-card:26px;--rad-btn:999px}
body[data-shape="sharp"]{--rad-card:6px;--rad-btn:4px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html{background:var(--bg);height:100%;min-height:100dvh;overscroll-behavior:none}
html.modal-lock,body.modal-lock{overflow:hidden !important;overscroll-behavior:none !important;touch-action:none}
body.modal-lock .app-wrap,body.modal-lock .bottom-nav,body.modal-lock .top-blur-bar{pointer-events:none !important;user-select:none !important}
input{user-select:text}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,12px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 92px);overflow-x:hidden;position:relative;overscroll-behavior:none}
body::before{content:"";position:fixed;top:-100vh;left:-50vw;right:-50vw;bottom:-100vh;background:var(--bg);pointer-events:none;z-index:-2}
body::after{content:"";position:fixed;left:0;right:0;bottom:-160px;height:165px;background:var(--bg);pointer-events:none;z-index:40}
.top-blur-bar{position:fixed;top:-24px;left:0;right:0;height:calc(env(safe-area-inset-top,28px) + 52px);background:linear-gradient(180deg,rgba(255,255,255,0.06) 0%,rgba(var(--acc-rgb),0.04) 48%,transparent 100%);backdrop-filter:blur(20px) saturate(185%);-webkit-backdrop-filter:blur(20px) saturate(185%);mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 58%,transparent 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12);pointer-events:none;z-index:54;opacity:0;transition:opacity 0.14s ease}
.top-blur-bar.show{opacity:1}
.top-blur-bar.hist-off{display:none !important;opacity:0 !important}
.app-wrap{max-width:460px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:4px 2px}
.brand-title{font-size:20px;font-weight:800;letter-spacing:-0.4px;color:var(--text)}
.ver-badge{font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--glass-btn);color:var(--acc);border:1px solid var(--glass-dock-border);letter-spacing:0.4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad-card);padding:15px;margin-bottom:12px;contain:content}
.card.compact{padding:12px 14px}
.label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);margin-bottom:9px}
.plat-badge{display:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--glass-active);color:var(--text);border:1px solid var(--glass-active-border)}
.url-row{display:flex;gap:8px}
.input-wrap{position:relative;flex:1;min-width:0}
.inp{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:var(--rad-btn);padding:12px 34px 12px 13px;font-size:14px;outline:none}
.inp:focus{border-color:var(--acc)}
.inp::placeholder{color:var(--muted);opacity:0.7}
.clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;border:none;background:var(--card-2);color:var(--muted);font-size:14px;display:none;align-items:center;justify-content:center;cursor:pointer}
.seg-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.theme-flex{display:flex;flex-wrap:wrap;gap:8px}
.theme-flex .seg-btn{flex:1 1 calc(33.333% - 8px);min-width:92px}
.btn-paste,.seg-btn,.act-btn,.fps-btn,.p-btn,.main-btn,.nav-btn,.save-opt-btn,.clear-btn{touch-action:manipulation}
.btn-paste,.seg-btn,.act-btn,.fps-btn,.p-btn{position:relative;color:var(--muted);border-radius:var(--rad-btn);font-size:13px;font-weight:600;text-align:center;cursor:pointer;transform:translateZ(0);backface-visibility:hidden;white-space:nowrap;line-height:1.25;transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1)}
.btn-paste:active,.seg-btn:active,.act-btn:active,.main-btn:active{transform:scale3d(0.95,0.95,1)}
.seg-btn{padding:11px 6px}
.seg-grid-4 .seg-btn{padding:11px 2px;font-size:12.5px}
.fps-btn{padding:7px 10px;font-size:12px;font-weight:700;border-radius:10px;flex:0 0 auto;white-space:nowrap;transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1)}
.fps-btn:active{transform:scale3d(0.9,0.9,1)}
.fps-btn.pop-anim{animation:pBtnPop 0.22s cubic-bezier(0.34,1.56,0.64,1)}
.btn-paste{color:var(--text);padding:0 16px;flex-shrink:0}
.act-btn{color:var(--text);padding:7px 11px;font-size:12px;flex-shrink:0}
.main-btn{width:100%;padding:15px;border-radius:var(--rad-btn);color:#ffffff;font-size:15px;font-weight:700;cursor:pointer;transform:translateZ(0);backface-visibility:hidden;white-space:nowrap;line-height:1.25;transition:transform 0.14s cubic-bezier(0.34,1.56,0.64,1)}
.main-btn:disabled{opacity:0.55;pointer-events:none}
.main-btn.stop-mode{background:linear-gradient(135deg,rgba(220,38,38,0.32) 0%,rgba(127,29,29,0.22) 100%) !important;border:1px solid rgba(248,113,113,0.55) !important;color:#fecaca !important;box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),0 6px 18px rgba(220,38,38,0.20) !important}
.bottom-nav{position:fixed;left:50%;bottom:max(12px, calc(env(safe-area-inset-bottom,0px) + 6px));transform:translate3d(-50%,0,0);width:calc(100% - 28px);max-width:432px;background:var(--glass-dock);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glass-dock-border);border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:60;box-shadow:inset 0 1px 0 rgba(255,255,255,0.14),0 10px 26px rgba(0,0,0,0.48)}
.nav-liquid-trail{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px) / 3);border-radius:999px;pointer-events:none;z-index:0;opacity:0;transform:translate3d(0,0,0) scale3d(1,1,1);will-change:transform,opacity,filter;backface-visibility:hidden}
.nav-liquid-pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 24px) / 3);border-radius:999px;pointer-events:none;z-index:0;transform:translate3d(0,0,0) scale3d(1,1,1);will-change:transform,filter;backface-visibility:hidden}
.nav-btn{position:relative;z-index:1;border-radius:999px;padding:11px 6px;font-size:13px;font-weight:700;color:var(--muted);background:transparent !important;border:1px solid transparent !important;box-shadow:none !important;text-align:center;cursor:pointer;transform:translateZ(0);backface-visibility:hidden;white-space:nowrap;line-height:1.25}
.nav-btn.active{color:#ffffff;background:transparent !important;border-color:transparent !important;box-shadow:none !important}

[data-btnstyle="gradient"] .seg-btn.active,[data-btnstyle="gradient"] .fps-btn.active,[data-btnstyle="gradient"] .nav-liquid-pill,[data-btnstyle="gradient"] .nav-liquid-trail{background:linear-gradient(135deg,rgba(var(--acc-rgb),1) 0%,rgba(var(--acc-rgb),0.74) 52%,rgba(255,255,255,0.22) 100%);color:#ffffff;border:1px solid rgba(255,255,255,0.52);box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.44),0 6px 16px rgba(var(--acc-rgb),0.36);text-shadow:0 1px 2px rgba(0,0,0,0.42)}
[data-btnstyle="gradient"] .main-btn{background:linear-gradient(135deg,rgba(var(--acc-rgb),1) 0%,rgba(var(--acc-rgb),0.72) 55%,rgba(255,255,255,0.20) 100%);color:#ffffff;border:1px solid rgba(255,255,255,0.46);box-shadow:inset 0 1.5px 1px rgba(255,255,255,0.44),0 8px 20px rgba(var(--acc-rgb),0.38);text-shadow:0 1px 2px rgba(0,0,0,0.42)}

#delSelectedBtn{font-variant-numeric:tabular-nums;min-width:94px;text-align:center;justify-content:center;display:inline-flex;align-items:center}
.hist-search-wrap{position:relative;margin-bottom:10px;display:flex;align-items:center}
.hist-search-inp{width:100%;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--rad-btn);padding:10px 14px;font-size:13px;outline:none}
.hist-search-inp.has-val{padding-right:118px}
.hist-search-inp:focus{border-color:var(--acc)}
.hist-search-inp::placeholder{color:var(--muted);opacity:0.75}
.hist-search-count{position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--glass-active);color:var(--text);border:1px solid var(--glass-active-border);font-variant-numeric:tabular-nums;pointer-events:none;display:none;white-space:nowrap}
.prog-wrap{display:none;margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--rad-card);padding:13px}
.prog-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-track{height:7px;background:var(--bg);border-radius:999px;overflow:hidden;transform:translateZ(0)}
.prog-fill{height:100%;width:100%;background:var(--acc);border-radius:999px;transform-origin:left center;transform:scale3d(0,1,1);will-change:transform}
@keyframes msgSlideIn{0%{opacity:0;transform:translate3d(0,10px,0) scale3d(0.97,0.97,1)}100%{opacity:1;transform:translate3d(0,0,0) scale3d(1,1,1)}}
