<!DOCTYPE html>
<html>
<body>

  <h1>Тест</h1>
  <p id="score">Монеты: 100</p>
<p id="uron">Урон: 10</p>
<p id="sek">В секунду: 0</p>
  <button
    onclick="klik()">Кликнуть</button>
  <button onclick="kupit()">Прокачка</button>
<button onclick="kupitAvto()">купить авто-клик (500)</button>
  <script>
    let coins = 100;
let sila = 10;
    let doxod = 0;
    function klik() {
      coins = coins + sila;
      score.textContent = "Монеты: " + coins;
    }

    function kupit() {
      if (coins >=50) {
      coins = coins - 50;
      sila = sila + 5;
        uron.textContent = "Урон: " + sila;
        score.textContent = "Монеты: " + coins;
      }
    }
   
    function kupitAvto() {
      if (coins >= 500){
      coins = coins - 500;
      doxod = doxod + 10;
      coins = coins + doxod;
      score.textContent = "Монеты: " + coins;
      sek.textContent = "В секунду:" + doxod;

      }
    }
    function avto() {
      coins = coins + doxod;
      score.textContent = "Монеты: " + coins;
    }
      setInterval(avto, 1000);
  
  </script>

</body>
</html>
